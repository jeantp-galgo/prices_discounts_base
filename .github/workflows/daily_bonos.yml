name: Reporte diario — Bonos Galgo MX

on:
  # ~08:00 hora Colombia (UTC-5). Se programa a las 12:37 UTC (7:37 AM CO)
  # para absorber el delay típico de GitHub Actions (~10-30 min fuera de pico).
  schedule:
    - cron: "37 12 * * *"

  # Permite ejecutar el workflow manualmente desde la pestaña Actions
  workflow_dispatch:

jobs:
  run-report:
    name: Generar reporte de bonos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar reporte
        env:
          MKP_MONITOR_BASE64: ${{ secrets.MKP_MONITOR_BASE64 }}
          MKP_PRICE_SHEETS_BASE64: ${{ secrets.MKP_PRICE_SHEETS_BASE64 }}
        run: python main.py
