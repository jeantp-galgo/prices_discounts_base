name: Reporte diario — Bonos Galgo MX

on:
  # 9:00 PM Colombia (UTC-5) = 02:00 UTC.
  # GitHub Actions puede agregar ~5-30 min de delay
  schedule:
    - cron: "0 4 * * *"

  # Permite ejecutar el workflow manualmente desde la pestaña Actions
  workflow_dispatch:

jobs:
  run-report:
    name: Generar reporte de bonos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar reporte
        env:
          MKP_MONITOR_BASE64: ${{ secrets.MKP_MONITOR_BASE64 }}
          MKP_PRICE_SHEETS_BASE64: ${{ secrets.MKP_PRICE_SHEETS_BASE64 }}
        run: python main.py

      - name: Email — ejecución exitosa
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          to: jtrujillo@galgo.com
          from: GitHub Actions
          subject: "✅ Reporte diario — Bonos Galgo MX completado — ${{ github.run_id }}"
          body: |
            El pipeline de Reporte diario — Bonos Galgo MX se ejecutó correctamente.

            Fecha: ${{ github.run_started_at }}
            Workflow: ${{ github.workflow }}
            Rama: ${{ github.ref_name }}

            Ver detalles: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Email — ejecución fallida
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          to: jtrujillo@galgo.com
          from: GitHub Actions
          subject: "❌ Reporte diario — Bonos Galgo MX falló — ${{ github.run_id }}"
          body: |
            El pipeline de Reporte diario — Bonos Galgo MX falló.

            Fecha: ${{ github.run_started_at }}
            Workflow: ${{ github.workflow }}
            Rama: ${{ github.ref_name }}

            Ver logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
